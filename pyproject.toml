[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-fintech-audit-env"
version = "1.3.0"
description = "RL Financial Audit Environment, Matcher, Judge Adapter, and Baselines"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]